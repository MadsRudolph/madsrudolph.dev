<line x1="620.0" y1="112" x2="620.0" y2="274" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
<text class="a" x="620.0" y="294" text-anchor="middle">0.55</text>
<text class="a" x="620" y="314" text-anchor="end">V rms</text>
<text class="a" x="656" y="104">bench → box</text>
<text class="lab" x="134" y="134.5" text-anchor="end">FRONT L</text>
