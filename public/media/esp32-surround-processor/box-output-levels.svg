<line x1="150.0" y1="112" x2="150.0" y2="274" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
<text class="a" x="150.0" y="294" text-anchor="middle">0.40</text>
<line x1="306.7" y1="112" x2="306.7" y2="274" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
