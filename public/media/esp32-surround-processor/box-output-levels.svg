<svg viewBox="0 0 900 350" width="900" height="350" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Line output level of the four outputs, bench against finished box">
<rect width="900" height="350" fill="#151312"/>
<style>.t{font:600 17px system-ui,sans-serif;fill:#ffffff}.s{font:14px system-ui,sans-serif;fill:#8f8888}.a{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#8f8888}.h{font:600 14px system-ui,sans-serif;fill:#ffffff}.v{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#c3c2b7}.n{font:13px system-ui,sans-serif;fill:#c3c2b7}.lab{font:13px system-ui,sans-serif;fill:#c3c2b7}</style>
<text class="t" x="18" y="26">Line output level, 1 kHz at −12 dBFS</text>
<text class="s" x="18" y="45">Each output on the bench with a test firmware, and in the finished box fed S/PDIF. Volume at maximum.</text>
<circle cx="156" cy="76" r="6" fill="#d95926"/>
<text class="lab" x="170" y="80.5">bench, test firmware</text>
<circle cx="348.0" cy="76" r="6" fill="#3987e5"/>
