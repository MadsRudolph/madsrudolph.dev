  <path d="M295 230V390H905V342" stroke="#888" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#a)"/>
  <path d="M905 390V400H1010V200H905V162" stroke="#888" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#a)"/>
  <path d="M600 390V362" stroke="#888" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#a)"/>
  <g font-size="15" fill="#444">
    <text x="164" y="180">light</text><text x="392" y="180">data</text>
    <text x="1070" y="110">front left</text><text x="1070" y="140">front right</text>
    <text x="1070" y="290">rear left</text><text x="1070" y="320">rear right</text>
    <text x="330" y="410" fill="#666">bit clock and word clock: the receiver drives them, the ESP32 and both DACs follow</text>
